name: Generate hero JPEG sequence

on:
  push:
    branches: [main]
    paths:
      - "public/media/hero.mp4"
      - ".github/workflows/generate-hero-frames.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hero-frame-generation
  cancel-in-progress: false

jobs:
  generate-frames:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version

      - name: Extract 30 fps JPEG frames
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/frames
          ffmpeg -hide_banner -loglevel error -y \
            -i public/media/hero.mp4 \
            -vf "fps=30,scale=960:540:flags=lanczos" \
            -q:v 9 -start_number 1 \
            public/frames/frame-%04d.jpg
          test -s public/frames/frame-0001.jpg
          test -s public/frames/frame-0240.jpg
          count="$(find public/frames -maxdepth 1 -type f -name 'frame-*.jpg' | wc -l)"
          echo "Generated $count JPEG frames"
          test "$count" -eq 240
          du -sh public/frames

      - name: Commit generated frames
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/frames
          if git diff --cached --quiet; then
            echo "The frame sequence is already up to date."
            exit 0
          fi
          git commit -m "Generate 30 fps hero JPEG sequence"
          git push origin HEAD:main
